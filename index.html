<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reader" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Book Reader</title>
    <script>
      // Applies the saved theme before the stylesheet paints, so a dark reader never flashes light.
      // Same key and values as src/storage/preferences.ts and THEME_COLORS in src/ui/theme.ts.
      try {
        var theme = localStorage.getItem('book-reader:theme');
        var color = { sepia: '#f3ead6', dark: '#1a1815' }[theme];
        if (color) {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = color;
        }
      } catch (error) {
        // Storage blocked: the app starts in the light theme and says why in the console.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
